name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ vars.GH_RUNNER || 'ubicloud-standard-2-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'

      - name: Enable Corepack and activate Yarn 4
        run: corepack enable && corepack prepare yarn@4.18.1 --activate

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: v1-node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test
