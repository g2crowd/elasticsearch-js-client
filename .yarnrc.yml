# Disable install scripts by default - mitigates Shai-Hulud-style worms
# spreading via postinstall. The only transitive script-bearing dep
# (node-gyp, via fsevents) is darwin-only and never installs on this
# repo's CircleCI (circleci/node image); local macOS dev degrades
# gracefully since nothing in this package depends on a native fsevents
# build.
enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@g2crowd/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
